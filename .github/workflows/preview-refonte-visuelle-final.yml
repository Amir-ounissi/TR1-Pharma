name: Preview refonte visuelle finale

on:
  push:
    branches:
      - preview/refonte-visuelle-final

permissions:
  contents: read

concurrency:
  group: preview-refonte-visuelle-final
  cancel-in-progress: true

env:
  RELEASE_SHA: 2cd34f9e9603676fafc8926df29c339b6041f818
  VERCEL_CLI_VERSION: 59.19.1
  STAGING_SUPABASE_URL: https://ehptapmuzckazyxmnmnm.supabase.co
  STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_j0dQKIs2SDsBgytuZj8vGw_LRBuA5Mv

jobs:
  deploy_preview:
    name: Preview finale isolée
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_WhI0GBrg7UZgZpDsvTwUGZ8V
      VERCEL_PROJECT_ID: prj_qUQM4tS4vVKQtBLSOlo545y3vEjt
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vérifier la cible
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$VERCEL_PROJECT_ID" = "prj_qUQM4tS4vVKQtBLSOlo545y3vEjt"
      - name: Déployer en preview uniquement
        run: |
          set -eu
          deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --yes --token "$VERCEL_TOKEN" \
            --build-env "APP_ENV=staging" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=$STAGING_SUPABASE_URL" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --env "APP_ENV=staging" \
            --env "NEXT_PUBLIC_SUPABASE_URL=$STAGING_SUPABASE_URL" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$STAGING_SUPABASE_PUBLISHABLE_KEY" | tail -n 1)"
          case "$deployment_url" in
            https://*.vercel.app) ;;
            *) echo "::error::URL preview Vercel invalide."; exit 1 ;;
          esac
          echo "PREVIEW_URL=$deployment_url" >> "$GITHUB_ENV"
          echo "Preview finale: $deployment_url"
      - name: Résumé
        run: |
          {
            echo "### Preview finale"
            echo "- SHA: `$RELEASE_SHA`"
            echo "- projet Vercel: staging séparé"
            echo "- cible: preview uniquement"
            echo "- URL: `$PREVIEW_URL`"
            echo "- production: NON TOUCHÉE"
          } >> "$GITHUB_STEP_SUMMARY"
