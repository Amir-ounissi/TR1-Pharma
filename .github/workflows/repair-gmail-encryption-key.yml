name: Repair Gmail credential encryption key

on:
  push:
    branches:
      - main
    paths:
      - ".ops/rotate-gmail-credential-encryption-key"

permissions:
  contents: read

concurrency:
  group: tr1-gmail-encryption-key-repair
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 59.19.1
  VERCEL_ORG_ID: team_WhI0GBrg7UZgZpDsvTwUGZ8V
  VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh

jobs:
  configure:
    name: Configure encrypted key in Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate one stable key and configure production + preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || {
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          }

          key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key"

          for target in production preview; do
            npx --yes "vercel@$VERCEL_CLI_VERSION" env rm TR1_CREDENTIAL_ENCRYPTION_KEY "$target"               --yes               --token="$VERCEL_TOKEN"               --scope="$VERCEL_ORG_ID" >/dev/null 2>&1 || true

            printf '%s\n' "$key" | npx --yes "vercel@$VERCEL_CLI_VERSION" env add TR1_CREDENTIAL_ENCRYPTION_KEY "$target"               --token="$VERCEL_TOKEN"               --scope="$VERCEL_ORG_ID" >/dev/null
          done

          unset key
          echo "TR1_CREDENTIAL_ENCRYPTION_KEY configured for production and preview."
