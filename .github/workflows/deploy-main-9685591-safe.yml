name: Deploy main 9685591 safely

on:
  push:
    branches:
      - ops/deploy-main-9685591-safe

permissions:
  contents: read
  actions: write

concurrency:
  group: tr1-safe-prod-9685591
  cancel-in-progress: false

env:
  RELEASE_SHA: 9685591519ef714aed51f6ba154003e1ff60cda0
  CI_RUN_ID: "35454863114"
  VERCEL_CLI_VERSION: 59.19.1
  CURRENT_PRODUCTION_SUPABASE_PROJECT_REF: zhifmehctuflwfexlvkz
  CURRENT_STAGING_SUPABASE_PROJECT_REF: ehptapmuzckazyxmnmnm
  CURRENT_PRODUCTION_VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh

jobs:
  production:
    name: Production sûre du main exact
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ehptapmuzckazyxmnmnm
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: zhifmehctuflwfexlvkz
      PRODUCTION_SUPABASE_URL: https://zhifmehctuflwfexlvkz.supabase.co
      PRODUCTION_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dFtfD60cflPn_IqSZriScQ_g0TRS66x
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_WhI0GBrg7UZgZpDsvTwUGZ8V
      VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
      PRODUCTION_URL: https://www.tr1pharma.com
    steps:
      - name: Neutraliser le staging Vercel dangereux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in $(seq 1 6); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&per_page=50")"
            ids="$(printf '%s' "$payload" | jq -r '
              .workflow_runs[]
              | select(
                  (.name == "Auto staging after green CI" or .name == "Release staging")
                  and (.status == "queued" or .status == "pending" or .status == "in_progress" or .status == "waiting" or .status == "requested")
                )
              | .id
            ')"
            if [ -n "$ids" ]; then
              while read -r run_id; do
                [ -n "$run_id" ] || continue
                gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
                echo "Annulation demandée: $run_id"
              done <<EOF
          $ids
          EOF
            fi
            sleep 5
          done

          payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&per_page=50")"
          active="$(printf '%s' "$payload" | jq '[.workflow_runs[] | select(
            (.name == "Auto staging after green CI" or .name == "Release staging")
            and (.status == "queued" or .status == "pending" or .status == "in_progress" or .status == "waiting" or .status == "requested")
          )] | length')"
          test "$active" -eq 0 || {
            echo "::error::Un staging automatique dangereux est encore actif."
            exit 1
          }

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Gate SHA, main et CI exacte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          current="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$RELEASE_SHA" || {
            echo "::error::main a changé: $current != $RELEASE_SHA"
            exit 1
          }
          ci="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          test "$(printf '%s' "$ci" | jq -r '.head_sha')" = "$RELEASE_SHA"
          test "$(printf '%s' "$ci" | jq -r '.status')" = "completed"
          test "$(printf '%s' "$ci" | jq -r '.conclusion')" = "success"

      - name: Vérifier la configuration production
        run: |
          set -eu
          for name in STAGING_DATABASE_URL STAGING_SUPABASE_PROJECT_REF PRODUCTION_DATABASE_URL PRODUCTION_SUPABASE_PROJECT_REF PRODUCTION_SUPABASE_URL PRODUCTION_SUPABASE_PUBLISHABLE_KEY VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_URL; do
            eval "value=\${$name:-}"
            test -n "$value" || { echo "::error::$name absent"; exit 1; }
          done
          test "$PRODUCTION_SUPABASE_PROJECT_REF" = "$CURRENT_PRODUCTION_SUPABASE_PROJECT_REF"
          test "$STAGING_SUPABASE_PROJECT_REF" = "$CURRENT_STAGING_SUPABASE_PROJECT_REF"
          test "$VERCEL_PROJECT_ID" = "$CURRENT_PRODUCTION_VERCEL_PROJECT_ID"
          test "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF"
          case "$PRODUCTION_DATABASE_URL" in *"$PRODUCTION_SUPABASE_PROJECT_REF"*) ;; *) echo "::error::PRODUCTION_DATABASE_URL invalide"; exit 1;; esac
          case "$STAGING_DATABASE_URL" in *"$STAGING_SUPABASE_PROJECT_REF"*) ;; *) echo "::error::STAGING_DATABASE_URL invalide"; exit 1;; esac

      - name: Préflight migrations
        run: npm run release:drift:preflight

      - name: Appliquer les migrations production
        run: npm exec -- supabase db push --db-url "$PRODUCTION_DATABASE_URL"

      - name: Exiger Git = staging = production
        run: npm run release:drift

      - name: Préparer le jeton one-shot HubSpot
        run: |
          set -eu
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "TR1_INTERNAL_RECONCILE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Revalider main juste avant Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          current="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$RELEASE_SHA" || {
            echo "::error::main a changé avant Vercel: $current != $RELEASE_SHA"
            exit 1
          }

      - name: Déployer exactement le SHA avec runtime production
        run: |
          set -eu
          test -n "$TR1_INTERNAL_RECONCILE_TOKEN"
          deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --yes --token "$VERCEL_TOKEN"             --build-env "APP_ENV=production"             --build-env "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL"             --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY"             --build-env "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL"             --env "APP_ENV=production"             --env "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL"             --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY"             --env "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL"             --env "TR1_INTERNAL_RECONCILE_TOKEN=$TR1_INTERNAL_RECONCILE_TOKEN" | tail -n 1)"
          case "$deployment_url" in https://*.vercel.app) ;; *) echo "::error::URL Vercel invalide"; exit 1;; esac
          echo "PRODUCTION_DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"
          echo "Production deployment: $deployment_url"

      - name: Smoke production
        run: BASE_URL="$PRODUCTION_URL" npm run staging:smoke

      - name: Exiger OAuth Supabase production
        run: |
          node <<'NODE'
          const expected = "zhifmehctuflwfexlvkz.supabase.co/auth/v1/authorize";
          const response = await fetch("https://www.tr1pharma.com/api/auth/google", { redirect: "manual" });
          const location = response.headers.get("location") || "";
          if (![302,303,307,308].includes(response.status)) throw new Error(`OAuth HTTP ${response.status}`);
          if (!location.includes(expected)) throw new Error(`OAuth cible incorrecte: ${location}`);
          console.log("OAuth Supabase production: PASS");
          NODE

      - name: Exécuter le reconcile HubSpot one-shot
        run: |
          set -eu
          response="$(curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $TR1_INTERNAL_RECONCILE_TOKEN"             "$PRODUCTION_URL/api/internal/hubspot/reconcile")"
          echo "$response" | jq .
          echo "$response" | jq -e '.ok == true' >/dev/null

      - name: Preuve
        run: |
          {
            echo "### Production main validée"
            echo "- SHA: `$RELEASE_SHA`"
            echo "- CI exacte: PASS"
            echo "- staging automatique dangereux: neutralisé"
            echo "- migrations: Git = staging = production"
            echo "- Vercel production: `$PRODUCTION_DEPLOYMENT_URL`"
            echo "- smoke production: PASS"
            echo "- OAuth Supabase production: PASS"
            echo "- reconcile HubSpot one-shot: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
