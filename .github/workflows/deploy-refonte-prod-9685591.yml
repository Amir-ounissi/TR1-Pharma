name: Deploy refonte production 9685591

on:
  push:
    branches:
      - ops/deploy-refonte-prod-9685591

permissions:
  contents: read
  actions: read

concurrency:
  group: tr1-production-release
  cancel-in-progress: false

env:
  RELEASE_SHA: 9685591519ef714aed51f6ba154003e1ff60cda0
  VERCEL_CLI_VERSION: 59.19.1
  CURRENT_PRODUCTION_SUPABASE_PROJECT_REF: zhifmehctuflwfexlvkz
  CURRENT_STAGING_SUPABASE_PROJECT_REF: ehptapmuzckazyxmnmnm
  CURRENT_PRODUCTION_VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh

jobs:
  production:
    name: Production exacte avec runtime production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ehptapmuzckazyxmnmnm
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: zhifmehctuflwfexlvkz
      PRODUCTION_SUPABASE_URL: https://zhifmehctuflwfexlvkz.supabase.co
      PRODUCTION_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dFtfD60cflPn_IqSZriScQ_g0TRS66x
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_WhI0GBrg7UZgZpDsvTwUGZ8V
      VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
      PRODUCTION_URL: https://www.tr1pharma.com
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Gate SHA, main, CI et staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          current="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$RELEASE_SHA" || { echo "::error::main a changé: $current != $RELEASE_SHA"; exit 1; }
          ci="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&per_page=20" --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
          test "$ci" -gt 0 || { echo "::error::CI verte absente"; exit 1; }
          staging="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-staging.yml/runs?head_sha=${RELEASE_SHA}&event=workflow_dispatch&per_page=20" --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
          test "$staging" -gt 0 || { echo "::error::Release staging verte absente"; exit 1; }
      - name: Vérifier la configuration production
        run: |
          set -eu
          for name in STAGING_DATABASE_URL STAGING_SUPABASE_PROJECT_REF PRODUCTION_DATABASE_URL PRODUCTION_SUPABASE_PROJECT_REF PRODUCTION_SUPABASE_URL PRODUCTION_SUPABASE_PUBLISHABLE_KEY VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_URL; do
            eval "value=\${$name:-}"
            test -n "$value" || { echo "::error::$name n'est pas configuré."; exit 1; }
          done
          test "$PRODUCTION_SUPABASE_PROJECT_REF" = "$CURRENT_PRODUCTION_SUPABASE_PROJECT_REF"
          test "$STAGING_SUPABASE_PROJECT_REF" = "$CURRENT_STAGING_SUPABASE_PROJECT_REF"
          test "$VERCEL_PROJECT_ID" = "$CURRENT_PRODUCTION_VERCEL_PROJECT_ID"
          test "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF"
          case "$PRODUCTION_DATABASE_URL" in *"$PRODUCTION_SUPABASE_PROJECT_REF"*) ;; *) exit 1;; esac
          case "$STAGING_DATABASE_URL" in *"$STAGING_SUPABASE_PROJECT_REF"*) ;; *) exit 1;; esac
          case "$PRODUCTION_SUPABASE_URL" in *"$PRODUCTION_SUPABASE_PROJECT_REF"*) ;; *) exit 1;; esac
      - name: Vérifier le préflight migrations
        run: npm run release:drift:preflight
      - name: Appliquer les migrations production
        run: npm exec -- supabase db push --db-url "$PRODUCTION_DATABASE_URL"
      - name: Exiger Git = staging = production
        run: npm run release:drift
      - name: Revalider main juste avant Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$RELEASE_SHA" || { echo "::error::main a changé avant Vercel"; exit 1; }
      - name: Déployer exactement le SHA avec le runtime production
        run: |
          set -eu
          deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env "APP_ENV=production" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            --build-env "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL" \
            --env "APP_ENV=production" \
            --env "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            --env "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL" | tail -n 1)"
          case "$deployment_url" in https://*.vercel.app) ;; *) echo "::error::URL Vercel invalide"; exit 1;; esac
          echo "PRODUCTION_DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"
      - name: Smoke production
        run: BASE_URL="$PRODUCTION_URL" npm run staging:smoke
      - name: Exiger OAuth sur Supabase production
        run: |
          node <<'NODE'
          const expected = "zhifmehctuflwfexlvkz.supabase.co/auth/v1/authorize";
          const response = await fetch("https://www.tr1pharma.com/api/auth/google", { redirect: "manual" });
          const location = response.headers.get("location") || "";
          if (![302,303,307,308].includes(response.status)) throw new Error(`OAuth HTTP ${response.status}`);
          if (!location.includes(expected)) throw new Error(`OAuth incorrect: ${location}`);
          console.log("OAuth Supabase production: PASS");
          NODE
      - name: Preuve
        run: |
          {
            echo "### Production refonte validée"
            echo "- SHA: `$RELEASE_SHA`"
            echo "- CI main: PASS"
            echo "- staging: PASS"
            echo "- migrations: PASS"
            echo "- Vercel: `$PRODUCTION_DEPLOYMENT_URL`"
            echo "- smoke: PASS"
            echo "- OAuth production: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
