name: Auto staging after green CI

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: tr1-auto-staging
  cancel-in-progress: false

jobs:
  dispatch:
    name: Déclencher le staging après CI verte
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le staging puis promouvoir uniquement s'il est vert
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -eu

          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run release-staging.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_sha="$RELEASE_SHA"
          echo "Release staging demandée automatiquement pour $RELEASE_SHA."

          staging_state=""
          staging_run_id=""
          for attempt in $(seq 1 80); do
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-staging.yml/runs?head_sha=${RELEASE_SHA}&event=workflow_dispatch&per_page=20" \
              > /tmp/staging-runs.json

            staging_run_id="$(jq -r --arg started "$dispatch_started" '
              [.workflow_runs[] | select(.created_at >= $started)]
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' /tmp/staging-runs.json)"

            if [ -n "$staging_run_id" ]; then
              staging_state="$(jq -r --argjson id "$staging_run_id" '
                .workflow_runs[]
                | select(.id == $id)
                | if .status == "completed" then (.conclusion // "unknown") else .status end
              ' /tmp/staging-runs.json)"
            else
              staging_state="missing"
            fi

            case "$staging_state" in
              success)
                echo "Release staging verte: run $staging_run_id."
                break
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::Release staging $staging_run_id terminée avec l'état $staging_state."
                exit 1
                ;;
              *)
                echo "Release staging: $staging_state — nouvelle vérification dans 15 s."
                sleep 15
                ;;
            esac
          done

          test "$staging_state" = "success" || {
            echo "::error::La Release staging n'est pas devenue verte dans la fenêtre d'orchestration."
            exit 1
          }

          if [[ "${HEAD_COMMIT_MESSAGE}" == *"[p0-runtime-recovery]"* ]]; then
            echo "Recovery runtime demandé : le déploiement production sera exécuté par le job dédié après ce staging vert."
          else
            gh workflow run release-production.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f release_sha="$RELEASE_SHA"
            echo "Release production demandée pour le même SHA $RELEASE_SHA."
          fi


  p0_runtime_recovery:
    name: P0 recovery — déployer le runtime production
    needs: dispatch
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, '[p0-runtime-recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERCEL_CLI_VERSION: 59.19.1
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_WhI0GBrg7UZgZpDsvTwUGZ8V
      VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
      PRODUCTION_SUPABASE_URL: https://zhifmehctuflwfexlvkz.supabase.co
      PRODUCTION_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dFtfD60cflPn_IqSZriScQ_g0TRS66x
      PRODUCTION_URL: https://www.tr1pharma.com
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vérifier la cible recovery
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_SUPABASE_URL PRODUCTION_SUPABASE_PUBLISHABLE_KEY PRODUCTION_URL; do
            eval "value=\${$name:-}"
            test -n "$value" || {
              echo "::error::$name n'est pas configuré pour le recovery."
              exit 1
            }
          done
          test "$VERCEL_PROJECT_ID" = "prj_KziP4kPjCBHDULmFuvGSLFOzDtVh"
          case "$PRODUCTION_SUPABASE_URL" in
            *"zhifmehctuflwfexlvkz"*) ;;
            *)
              echo "::error::La cible Supabase n'est pas la production vérifiée."
              exit 1
              ;;
          esac

      - name: Déployer le SHA exact avec le runtime Supabase production
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env "APP_ENV=production" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            --build-env "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL" \
            --env "APP_ENV=production" \
            --env "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            --env "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Smoke production
        run: BASE_URL="$PRODUCTION_URL" npm run staging:smoke

      - name: Preuve recovery
        run: |
          {
            echo "### P0 runtime recovery validé"
            echo "- SHA: \\`$RELEASE_SHA\\`"
            echo "- staging officiel: PASS"
            echo "- Vercel production: déployé"
            echo "- runtime Supabase production: injecté"
            echo "- smoke production: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
