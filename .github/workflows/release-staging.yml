name: Release staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA Git exact à valider et déployer uniquement en staging"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tr1-staging-release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  VERCEL_CLI_VERSION: 59.19.1
  CURRENT_PRODUCTION_SUPABASE_PROJECT_REF: zhifmehctuflwfexlvkz
  CURRENT_STAGING_SUPABASE_PROJECT_REF: ehptapmuzckazyxmnmnm
  CURRENT_PRODUCTION_VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
  CURRENT_STAGING_VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
  STAGING_VERCEL_TARGET: preview

jobs:
  gate:
    name: Gate du SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Vérifier le SHA et son appartenance à main
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || {
            echo "::error::Le checkout ne correspond pas au SHA demandé."
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "::error::Le SHA demandé n'appartient pas à l'historique de main."
            exit 1
          }

      - name: Exiger une CI verte sur ce SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          count="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
          test "$count" -gt 0 || {
            echo "::error::Aucune CI complète et verte n'est attachée au SHA $RELEASE_SHA."
            exit 1
          }

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release:check:local

  staging:
    name: Staging uniquement — migrations, déploiement et smoke
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ehptapmuzckazyxmnmnm
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_ORG_ID: team_WhI0GBrg7UZgZpDsvTwUGZ8V
      VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
      STAGING_SUPABASE_URL: https://ehptapmuzckazyxmnmnm.supabase.co
      STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_j0dQKIs2SDsBgytuZj8vGw_LRBuA5Mv
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Vérifier la configuration staging
        run: |
          set -eu
          for name in STAGING_DATABASE_URL STAGING_SUPABASE_PROJECT_REF VERCEL_TOKEN VERCEL_AUTOMATION_BYPASS_SECRET VERCEL_ORG_ID VERCEL_PROJECT_ID STAGING_SUPABASE_URL STAGING_SUPABASE_PUBLISHABLE_KEY; do
            eval "value=\${$name:-}"
            test -n "$value" || {
              echo "::error::$name n'est pas configuré pour l'environnement staging."
              exit 1
            }
          done

      - name: Interdire explicitement toute cible Supabase de production
        run: |
          set -eu
          test "$STAGING_SUPABASE_PROJECT_REF" = "$CURRENT_STAGING_SUPABASE_PROJECT_REF" || {
            echo "::error::Le projet Supabase staging ne correspond pas au staging canonique."
            exit 1
          }
          test "$STAGING_SUPABASE_PROJECT_REF" != "$CURRENT_PRODUCTION_SUPABASE_PROJECT_REF" || {
            echo "::error::Le projet staging ne peut pas être la production."
            exit 1
          }
          test "$STAGING_VERCEL_TARGET" = "preview" || {
            echo "::error::Le staging doit rester un déploiement Vercel preview."
            exit 1
          }
          test "$VERCEL_PROJECT_ID" = "$CURRENT_STAGING_VERCEL_PROJECT_ID" || {
            echo "::error::Le projet Vercel staging ne correspond pas au projet canonique."
            exit 1
          }
          case "$STAGING_DATABASE_URL" in
            *"$CURRENT_PRODUCTION_SUPABASE_PROJECT_REF"*)
              echo "::error::STAGING_DATABASE_URL pointe vers la production. Release bloquée."
              exit 1
              ;;
          esac
          case "$STAGING_DATABASE_URL" in
            *"$STAGING_SUPABASE_PROJECT_REF"*) ;;
            *)
              echo "::error::STAGING_DATABASE_URL ne correspond pas à STAGING_SUPABASE_PROJECT_REF."
              exit 1
              ;;
          esac
          case "$STAGING_SUPABASE_URL" in
            *"$STAGING_SUPABASE_PROJECT_REF"*) ;;
            *)
              echo "::error::STAGING_SUPABASE_URL ne correspond pas à STAGING_SUPABASE_PROJECT_REF."
              exit 1
              ;;
          esac
          case "$STAGING_SUPABASE_URL" in
            *"$CURRENT_PRODUCTION_SUPABASE_PROJECT_REF"*)
              echo "::error::STAGING_SUPABASE_URL pointe vers la production. Release bloquée."
              exit 1
              ;;
          esac

      - name: Préparer la connexion session Supabase
        run: |
          set -eu
          session_url="$(node -e 'const u = new URL(process.env.STAGING_DATABASE_URL); if (u.port === "6543") u.port = "5432"; process.stdout.write(u.toString())')"
          echo "::add-mask::$session_url"
          echo "STAGING_SESSION_DATABASE_URL=$session_url" >> "$GITHUB_ENV"

      - name: Prévisualiser les migrations staging
        run: npm exec -- supabase db push --db-url "$STAGING_SESSION_DATABASE_URL" --dry-run

      - name: Appliquer les migrations staging
        run: npm exec -- supabase db push --db-url "$STAGING_SESSION_DATABASE_URL"

      - name: Exiger Git = staging
        run: STAGING_DATABASE_URL="$STAGING_SESSION_DATABASE_URL" npm run release:drift:staging

      - name: Déployer exactement le SHA sur Vercel staging
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --yes --token "$VERCEL_TOKEN" \
            --build-env "APP_ENV=staging" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=$STAGING_SUPABASE_URL" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --env "APP_ENV=staging" \
            --env "NEXT_PUBLIC_SUPABASE_URL=$STAGING_SUPABASE_URL" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$STAGING_SUPABASE_PUBLISHABLE_KEY" | tail -n 1)"
          case "$deployment_url" in
            https://tr-1-pharma-*.vercel.app) ;;
            *)
              echo "::error::Vercel n'a pas renvoyé une URL de déploiement exploitable."
              exit 1
              ;;
          esac
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"
          echo "STAGING_DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"
          echo "STAGING_PROTECTION_BYPASS=$VERCEL_AUTOMATION_BYPASS_SECRET" >> "$GITHUB_ENV"
          echo "Déploiement staging: $deployment_url"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Smoke applicatif authentifié du preview Vercel protégé
        run: |
          set -euo pipefail

          request() {
            local route="$1"
            shift
            HTTP_BODY="$(mktemp)"
            HTTP_HEADERS="$(mktemp)"
            local raw_status
            raw_status="$(curl --silent --show-error \
              -H "x-vercel-protection-bypass: $STAGING_PROTECTION_BYPASS" \
              -D "$HTTP_HEADERS" -o "$HTTP_BODY" -w "%{http_code}" \
              "$@" "$STAGING_DEPLOYMENT_URL$route")"
            HTTP_STATUS="$(printf '%s\n' "$raw_status" | grep -Eo '[1-5][0-9]{2}' | tail -n 1)"
            test -n "$HTTP_STATUS" || {
              echo "::error::Impossible de lire le statut HTTP pour $route."
              exit 1
            }
          }

          for route in / /merci /connexion /signup /mentions-legales /politique-de-confidentialite; do
            request "$route"
            test "$HTTP_STATUS" = "200" || {
              echo "::error::$route répond $HTTP_STATUS, attendu 200."
              head -c 300 "$HTTP_BODY" || true
              exit 1
            }
            test "$(wc -c < "$HTTP_BODY")" -ge 100 || {
              echo "::error::$route retourne un contenu anormalement court."
              exit 1
            }
            if grep -Eqi 'vercel\.com/sso-api|_vercel_sso_nonce' "$HTTP_BODY"; then
              echo "::error::$route retourne encore la protection Vercel au lieu de TR1."
              exit 1
            fi
            echo "$route : 200"
          done

          request "/api/release-health"
          test "$HTTP_STATUS" = "200" || {
            echo "::error::/api/release-health répond $HTTP_STATUS, attendu 200."
            head -c 300 "$HTTP_BODY" || true
            exit 1
          }
          node - "$HTTP_BODY" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const raw = fs.readFileSync(file, "utf8");
          let health;
          try {
            health = JSON.parse(raw);
          } catch {
            console.error("::error::/api/release-health ne retourne pas du JSON TR1.");
            process.exit(1);
          }
          if (
            health?.ok !== true ||
            health?.service !== "tr1-pharma" ||
            health?.appEnv !== "staging" ||
            health?.supabaseProjectRef !== process.env.STAGING_SUPABASE_PROJECT_REF
          ) {
            console.error(
              "::error::Preuve /api/release-health invalide: " +
                JSON.stringify(health).slice(0, 300),
            );
            process.exit(1);
          }
          NODE
          echo "/api/release-health : 200"

          request "/api/auth/forgot-password" \
            -X POST \
            -H "Content-Type: application/json" \
            --data "{\"email\":\"staging-smoke-${GITHUB_RUN_ID}@example.invalid\"}"
          test "$HTTP_STATUS" = "200" || {
            echo "::error::/api/auth/forgot-password répond $HTTP_STATUS, attendu 200."
            head -c 300 "$HTTP_BODY" || true
            exit 1
          }
          echo "/api/auth/forgot-password : 200"

          request "/api/auth/google"
          case "$HTTP_STATUS" in
            302|303|307|308) ;;
            *)
              echo "::error::/api/auth/google répond $HTTP_STATUS, attendu une redirection OAuth."
              head -c 300 "$HTTP_BODY" || true
              exit 1
              ;;
          esac
          oauth_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$HTTP_HEADERS")"
          case "$oauth_location" in
            *"$STAGING_SUPABASE_URL/auth/v1/authorize"*) ;;
            *)
              echo "::error::/api/auth/google redirige vers une cible inattendue: ${oauth_location:-vide}."
              exit 1
              ;;
          esac
          echo "/api/auth/google : $HTTP_STATUS"

          request "/dashboard/agent"
          case "$HTTP_STATUS" in
            302|303|307|308) ;;
            *)
              echo "::error::/dashboard/agent répond $HTTP_STATUS, attendu une redirection anonyme."
              head -c 300 "$HTTP_BODY" || true
              exit 1
              ;;
          esac
          echo "/dashboard/agent : $HTTP_STATUS"

          echo "Smoke staging avec bypass d'automatisation réussi sur $STAGING_DEPLOYMENT_URL"

      - name: Preuve staging
        run: |
          {
            echo "### Staging validé — aucune action production"
            echo "- SHA: \`$RELEASE_SHA\`"
            echo "- Supabase: staging distinct de la production"
            echo "- Vercel: preview uniquement, aucun --prod"
            echo "- migrations: Git = staging"
            echo "- déploiement créé: \`$STAGING_DEPLOYMENT_URL\`"
            echo "- URL de preview testée: \`$STAGING_DEPLOYMENT_URL\`"
            echo "- smoke applicatif avec Protection Bypass for Automation: PASS"
            echo "- production: NON TOUCHÉE"
          } >> "$GITHUB_STEP_SUMMARY"
