name: Release staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA Git à déployer uniquement en staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tr1-staging-release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  VERCEL_CLI_VERSION: 59.19.1
  CURRENT_PRODUCTION_SUPABASE_PROJECT_REF: zhifmehctuflwfexlvkz

jobs:
  staging:
    name: Staging — migrations, déploiement et smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_STAGING_PROJECT_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Vérifier que le SHA appartient à main
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || {
            echo "::error::Le checkout ne correspond pas au SHA demandé."
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "::error::Le SHA demandé n'appartient pas à main."
            exit 1
          }

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release:check:local

      - name: Vérifier la configuration staging
        run: |
          set -eu
          for name in STAGING_DATABASE_URL STAGING_SUPABASE_PROJECT_REF VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID STAGING_URL; do
            eval "value=\${$name:-}"
            test -n "$value" || {
              echo "::error::$name n'est pas configuré pour l'environnement staging."
              exit 1
            }
          done

      - name: Interdire explicitement toute cible Supabase de production
        run: |
          set -eu
          test "$STAGING_SUPABASE_PROJECT_REF" != "$CURRENT_PRODUCTION_SUPABASE_PROJECT_REF" || {
            echo "::error::Le projet staging ne peut pas être la production."
            exit 1
          }
          case "$STAGING_DATABASE_URL" in
            *"$CURRENT_PRODUCTION_SUPABASE_PROJECT_REF"*)
              echo "::error::STAGING_DATABASE_URL pointe vers la production. Release bloquée."
              exit 1
              ;;
          esac
          case "$STAGING_DATABASE_URL" in
            *"$STAGING_SUPABASE_PROJECT_REF"*) ;;
            *)
              echo "::error::STAGING_DATABASE_URL ne correspond pas à STAGING_SUPABASE_PROJECT_REF."
              exit 1
              ;;
          esac

      - name: Prévisualiser les migrations staging
        run: npm exec -- supabase db push --db-url "$STAGING_DATABASE_URL" --dry-run

      - name: Appliquer les migrations staging
        run: npm exec -- supabase db push --db-url "$STAGING_DATABASE_URL"

      - name: Exiger Git = staging
        run: npm run release:drift:staging

      - name: Déployer sur le projet Vercel staging
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --yes --token "$VERCEL_TOKEN"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Smoke staging
        run: BASE_URL="$STAGING_URL" npm run staging:smoke

      - name: Preuve staging
        run: |
          {
            echo "### Staging validé — aucune action production"
            echo "- SHA: \`$RELEASE_SHA\`"
            echo "- Supabase: staging distinct de la production"
            echo "- migrations: Git = staging"
            echo "- smoke: PASS"
            echo "- production: NON TOUCHÉE"
          } >> "$GITHUB_STEP_SUMMARY"
