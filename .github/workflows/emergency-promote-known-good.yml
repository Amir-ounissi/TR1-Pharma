name: Emergency promote known-good production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tr1-emergency-production-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote known-good production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_WhI0GBrg7UZgZpDsvTwUGZ8V
      VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
      VERCEL_CLI_VERSION: 59.19.1
      KNOWN_GOOD_DEPLOYMENT: tr-1-pharma-2e2ks00pc-amir-ounissis-projects-723e961a.vercel.app
      PRODUCTION_URL: https://www.tr1pharma.com
      PRODUCTION_SUPABASE_REF: zhifmehctuflwfexlvkz
    steps:
      - name: Vérifier le secret Vercel
        run: |
          set -eu
          test -n "${VERCEL_TOKEN:-}" || {
            echo "::error::VERCEL_TOKEN manquant dans l'environnement production."
            exit 1
          }

      - name: Promouvoir le déploiement connu comme sain
        run: |
          set -eu
          npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "${KNOWN_GOOD_DEPLOYMENT}" --yes --token "${VERCEL_TOKEN}"

      - name: Vérifier la production publique
        run: |
          set -eu
          curl --fail --silent --show-error "${PRODUCTION_URL}/" >/dev/null
          location="$(curl --silent --show-error --output /dev/null --dump-header - "${PRODUCTION_URL}/api/auth/google" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location:[[:space:]]*/, ""); print; exit}')"
          echo "OAuth Location: ${location}"
          printf '%s' "${location}" | grep -q "${PRODUCTION_SUPABASE_REF}.supabase.co" || {
            echo "::error::La production ne pointe pas vers le Supabase production attendu."
            exit 1
          }
          echo "Production rétablie sur le runtime connu comme sain."

# Triggered after workflow registration on main.

# Recovery retry triggered after detecting staging OAuth on the public production domain.

# P0 runtime recovery trigger: verify production Supabase routing after deployment.
