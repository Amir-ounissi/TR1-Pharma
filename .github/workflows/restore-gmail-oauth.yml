name: Restore Gmail Google OAuth

on:
  push:
    branches:
      - main
    paths:
      - ".ops/restore-gmail-oauth"

permissions:
  contents: read

concurrency:
  group: tr1-gmail-oauth-restore
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 59.19.1
  VERCEL_ORG_ID: team_WhI0GBrg7UZgZpDsvTwUGZ8V
  VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh

jobs:
  configure:
    name: Restore Google OAuth in Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate protected secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured."; exit 1; }
          test -n "${GOOGLE_OAUTH_CLIENT_ID:-}" || { echo "::error::GOOGLE_OAUTH_CLIENT_ID is not configured in the GitHub production environment."; exit 1; }
          test -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}" || { echo "::error::GOOGLE_OAUTH_CLIENT_SECRET is not configured in the GitHub production environment."; exit 1; }
          echo "::add-mask::$GOOGLE_OAUTH_CLIENT_ID"
          echo "::add-mask::$GOOGLE_OAUTH_CLIENT_SECRET"

      - name: Restore Google OAuth variables in Vercel production
        shell: bash
        run: |
          set -euo pipefail
          for key in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET; do
            value="${!key}"
            npx --yes "vercel@$VERCEL_CLI_VERSION" env rm "$key" production               --yes               --token="$VERCEL_TOKEN"               --scope="$VERCEL_ORG_ID" >/dev/null 2>&1 || true
            printf '%s\n' "$value" | npx --yes "vercel@$VERCEL_CLI_VERSION" env add "$key" production               --token="$VERCEL_TOKEN"               --scope="$VERCEL_ORG_ID" >/dev/null
          done
          echo "Google OAuth variables restored in Vercel production."
