name: Mobile EAS iOS Internal Build

on:
  push:
    branches:
      - feat/mobile-mvp-foundation
    paths:
      - ".github/workflows/mobile-eas-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build:
    name: Build iOS internal preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check Expo authentication
        id: expo_auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Expo authentication required::Repository secret EXPO_TOKEN is missing."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Validate iOS EAS config
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest config --platform ios --profile preview --non-interactive

      - name: Attempt iOS internal build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest build --platform ios --profile preview --non-interactive --wait
