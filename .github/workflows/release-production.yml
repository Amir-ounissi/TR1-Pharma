name: Release production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA Git exact à valider en staging puis déployer en production"
        required: true
        type: string
      confirm_production:
        description: "Saisir DEPLOY_PRODUCTION pour autoriser la production"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tr1-production-release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
  VERCEL_CLI_VERSION: 59.19.1
  CURRENT_PRODUCTION_SUPABASE_PROJECT_REF: zhifmehctuflwfexlvkz
  CURRENT_STAGING_SUPABASE_PROJECT_REF: ehptapmuzckazyxmnmnm
  CURRENT_PRODUCTION_VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
  CURRENT_STAGING_VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
  CURRENT_STAGING_VERCEL_TARGET: preview

jobs:
  gate:
    name: Gate du SHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Exiger une confirmation production explicite
        run: |
          set -eu
          test "$CONFIRM_PRODUCTION" = "DEPLOY_PRODUCTION" || {
            echo "::error::Confirmation production invalide."
            exit 1
          }

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Vérifier le SHA et son appartenance à main
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || {
            echo "::error::Le checkout ne correspond pas au SHA demandé."
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "::error::Le SHA demandé n'appartient pas à l'historique de main."
            exit 1
          }

      - name: Exiger une CI verte sur ce SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          result=""
          for attempt in $(seq 1 30); do
            result="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&per_page=20" \
              --jq '(.workflow_runs | sort_by(.run_started_at) | reverse | .[0]) as $run | if $run == null then "missing" elif $run.status == "completed" then ($run.conclusion // "unknown") else $run.status end')"
            case "$result" in
              success)
                echo "CI verte trouvée pour $RELEASE_SHA."
                break
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::La CI du SHA $RELEASE_SHA est terminée avec l'état $result."
                exit 1
                ;;
              *)
                echo "CI $RELEASE_SHA: $result — nouvelle vérification dans 20 s."
                sleep 20
                ;;
            esac
          done
          test "$result" = "success" || {
            echo "::error::La CI du SHA $RELEASE_SHA n'est pas devenue verte dans la fenêtre du gate."
            exit 1
          }

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release:check:local

  staging:
    name: Staging officiel — preuve et smoke
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Exiger une Release staging verte sur ce SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          count="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-staging.yml/runs?head_sha=${RELEASE_SHA}&event=workflow_dispatch&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
          test "$count" -gt 0 || {
            echo "::error::Aucune Release staging verte n'est attachée au SHA $RELEASE_SHA."
            exit 1
          }

      - name: Preuve staging
        run: |
          {
            echo "### Staging officiel validé"
            echo "- SHA: `$RELEASE_SHA`"
            echo "- workflow Release staging: PASS"
            echo "- smoke du preview staging: PASS dans le workflow Release staging"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production — migration gate et déploiement du même SHA
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ehptapmuzckazyxmnmnm
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: zhifmehctuflwfexlvkz
      PRODUCTION_SUPABASE_URL: https://zhifmehctuflwfexlvkz.supabase.co
      PRODUCTION_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dFtfD60cflPn_IqSZriScQ_g0TRS66x
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_ORG_ID: team_WhI0GBrg7UZgZpDsvTwUGZ8V
      VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
      PRODUCTION_URL: https://www.tr1pharma.com
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Vérifier la configuration production
        run: |
          set -eu
          for name in STAGING_DATABASE_URL STAGING_SUPABASE_PROJECT_REF PRODUCTION_DATABASE_URL PRODUCTION_SUPABASE_PROJECT_REF PRODUCTION_SUPABASE_URL PRODUCTION_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY HUBSPOT_ACCESS_TOKEN AI_GATEWAY_API_KEY VERCEL_TOKEN VERCEL_AUTOMATION_BYPASS_SECRET VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_URL; do
            eval "value=\${$name:-}"
            test -n "$value" || {
              echo "::error::$name n'est pas configuré pour l'environnement production."
              exit 1
            }
          done
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$PRODUCTION_SUPABASE_PROJECT_REF" = "$CURRENT_PRODUCTION_SUPABASE_PROJECT_REF" || {
            echo "::error::PRODUCTION_SUPABASE_PROJECT_REF ne correspond pas au projet de production actuellement vérifié."
            exit 1
          }
          test "$STAGING_SUPABASE_PROJECT_REF" = "$CURRENT_STAGING_SUPABASE_PROJECT_REF" || {
            echo "::error::STAGING_SUPABASE_PROJECT_REF ne correspond pas au staging canonique."
            exit 1
          }
          test "$VERCEL_PROJECT_ID" = "$CURRENT_PRODUCTION_VERCEL_PROJECT_ID" || {
            echo "::error::Le projet Vercel de production n'est pas le projet canonique."
            exit 1
          }
          test "$CURRENT_STAGING_VERCEL_TARGET" = "preview" || {
            echo "::error::Le staging Vercel doit rester en preview et ne jamais utiliser --prod."
            exit 1
          }
          case "$PRODUCTION_SUPABASE_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*) ;;
            *)
              echo "::error::PRODUCTION_SUPABASE_URL ne correspond pas au projet Supabase production."
              exit 1
              ;;
          esac
          test "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" || {
            echo "::error::Staging et production ne peuvent pas partager le même projet Supabase."
            exit 1
          }
          case "$PRODUCTION_DATABASE_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*) ;;
            *)
              echo "::error::PRODUCTION_DATABASE_URL ne correspond pas à PRODUCTION_SUPABASE_PROJECT_REF."
              exit 1
              ;;
          esac
          case "$STAGING_DATABASE_URL" in
            *"$STAGING_SUPABASE_PROJECT_REF"*) ;;
            *)
              echo "::error::STAGING_DATABASE_URL ne correspond pas à STAGING_SUPABASE_PROJECT_REF."
              exit 1
              ;;
          esac

      - name: Vérifier le préflight migrations
        run: npm run release:drift:preflight

      - name: Appliquer les migrations production
        run: npm exec -- supabase db push --db-url "$PRODUCTION_DATABASE_URL"

      - name: Exiger Git = staging = production
        run: npm run release:drift

      - name: Construire la candidate production sans basculer les domaines
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          # Use the server-only Supabase credential stored in the protected
          # GitHub production environment. Vercel env pull intentionally redacts
          # sensitive values, so it cannot be used as a secret transport.
          SUPABASE_ADMIN_KEY="$SUPABASE_SECRET_KEY"
          echo "::add-mask::$SUPABASE_ADMIN_KEY"
          echo "::add-mask::$AI_GATEWAY_API_KEY"
          RECONCILE_TOKEN="$(printf 'tr1-hubspot-reconcile:%s' "$VERCEL_AUTOMATION_BYPASS_SECRET" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$RECONCILE_TOKEN"
          deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" \
            --build-env "APP_ENV=production" \
            --build-env "RELEASE_SHA=$RELEASE_SHA" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            --build-env "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL" \
            --build-env "HUBSPOT_ACCESS_TOKEN=$HUBSPOT_ACCESS_TOKEN" \
            --build-env "AI_GATEWAY_API_KEY=$AI_GATEWAY_API_KEY" \
            --build-env "TR1_HUBSPOT_MODE=write" \
            --build-env "TR1_HUBSPOT_WRITE_ENABLED=true" \
            --env "APP_ENV=production" \
            --env "RELEASE_SHA=$RELEASE_SHA" \
            --env "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            --env "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL" \
            --env "SUPABASE_SECRET_KEY=$SUPABASE_ADMIN_KEY" \
            --env "HUBSPOT_ACCESS_TOKEN=$HUBSPOT_ACCESS_TOKEN" \
            --env "AI_GATEWAY_API_KEY=$AI_GATEWAY_API_KEY" \
            --env "TR1_HUBSPOT_MODE=write" \
            --env "TR1_HUBSPOT_WRITE_ENABLED=true" \
            --env "TR1_INTERNAL_RECONCILE_TOKEN=$RECONCILE_TOKEN" | tail -n 1)"
          case "$deployment_url" in
            https://tr-1-pharma-*.vercel.app) ;;
            *)
              echo "::error::Vercel n'a pas renvoyé une URL de candidate production exploitable."
              exit 1
              ;;
          esac
          deployment_host="${deployment_url#https://}"
          deployment_response="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID" \
            -o "$deployment_response"
          deployment_id="$(node - "$deployment_response" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (typeof payload.id !== "string" || !payload.id.startsWith("dpl_")) process.exit(1);
          process.stdout.write(payload.id);
          NODE
          )"
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"
          echo "PRODUCTION_DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"
          echo "PRODUCTION_DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          echo "PRODUCTION_PROTECTION_BYPASS=$VERCEL_AUTOMATION_BYPASS_SECRET" >> "$GITHUB_ENV"
          echo "PRODUCTION_RECONCILE_TOKEN=$RECONCILE_TOKEN" >> "$GITHUB_ENV"
          echo "Candidate production non promue: $deployment_url ($deployment_id)"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Vérifier la candidate production avant promotion
        run: |
          set -euo pipefail

          request() {
            local route="$1"
            shift
            HTTP_BODY="$(mktemp)"
            HTTP_HEADERS="$(mktemp)"
            local raw_status
            raw_status="$(curl --silent --show-error \
              -H "x-vercel-protection-bypass: $PRODUCTION_PROTECTION_BYPASS" \
              -D "$HTTP_HEADERS" -o "$HTTP_BODY" -w "%{http_code}" \
              "$@" "$PRODUCTION_DEPLOYMENT_URL$route")"
            HTTP_STATUS="$(printf '%s\n' "$raw_status" | grep -Eo '[1-5][0-9]{2}' | tail -n 1)"
            test -n "$HTTP_STATUS" || {
              echo "::error::Impossible de lire le statut HTTP pour $route."
              exit 1
            }
          }

          for route in / /merci /signup /mentions-legales /politique-de-confidentialite; do
            request "$route"
            test "$HTTP_STATUS" = "200" || {
              echo "::error::$route répond $HTTP_STATUS, attendu 200."
              head -c 300 "$HTTP_BODY" || true
              exit 1
            }
            test "$(wc -c < "$HTTP_BODY")" -ge 100 || {
              echo "::error::$route retourne un contenu anormalement court."
              exit 1
            }
            if grep -Eqi 'vercel\.com/sso-api|_vercel_sso_nonce' "$HTTP_BODY"; then
              echo "::error::$route retourne encore la protection Vercel au lieu de TR1."
              exit 1
            fi
            echo "$route : 200"
          done

          request "/connexion"
          case "$HTTP_STATUS" in
            302|303|307|308) ;;
            *)
              echo "::error::/connexion répond $HTTP_STATUS, attendu une redirection vers /login."
              head -c 300 "$HTTP_BODY" || true
              exit 1
              ;;
          esac
          connexion_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$HTTP_HEADERS")"
          case "$connexion_location" in
            /login|"$PRODUCTION_DEPLOYMENT_URL/login") ;;
            *)
              echo "::error::/connexion redirige vers une cible inattendue: ${connexion_location:-vide}."
              exit 1
              ;;
          esac
          echo "/connexion : $HTTP_STATUS vers /login"

          request "/api/release-health"
          test "$HTTP_STATUS" = "200" || {
            echo "::error::/api/release-health répond $HTTP_STATUS, attendu 200."
            head -c 300 "$HTTP_BODY" || true
            exit 1
          }
          node - "$HTTP_BODY" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const raw = fs.readFileSync(file, "utf8");
          let health;
          try {
            health = JSON.parse(raw);
          } catch {
            console.error("::error::/api/release-health ne retourne pas du JSON TR1.");
            process.exit(1);
          }
          if (
            health?.ok !== true ||
            health?.service !== "tr1-pharma" ||
            health?.appEnv !== "production" ||
            health?.releaseSha !== process.env.RELEASE_SHA ||
            health?.supabaseProjectRef !== process.env.PRODUCTION_SUPABASE_PROJECT_REF
          ) {
            console.error(
              "::error::Preuve /api/release-health production invalide: " +
                JSON.stringify(health).slice(0, 300),
            );
            process.exit(1);
          }
          NODE
          echo "/api/release-health : production + Supabase production"

          request "/api/auth/forgot-password" \
            -X POST \
            -H "Content-Type: application/json" \
            --data "{\"email\":\"production-smoke-${GITHUB_RUN_ID}@example.invalid\"}"
          test "$HTTP_STATUS" = "200" || {
            echo "::error::/api/auth/forgot-password répond $HTTP_STATUS, attendu 200."
            head -c 300 "$HTTP_BODY" || true
            exit 1
          }
          echo "/api/auth/forgot-password : 200"

          request "/api/auth/google"
          case "$HTTP_STATUS" in
            302|303|307|308) ;;
            *)
              echo "::error::/api/auth/google répond $HTTP_STATUS, attendu une redirection OAuth."
              head -c 300 "$HTTP_BODY" || true
              exit 1
              ;;
          esac
          oauth_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$HTTP_HEADERS")"
          case "$oauth_location" in
            "$PRODUCTION_SUPABASE_URL/auth/v1/authorize"*) ;;
            *)
              echo "::error::/api/auth/google redirige vers une cible inattendue: ${oauth_location:-vide}."
              exit 1
              ;;
          esac
          echo "/api/auth/google : $HTTP_STATUS vers Supabase production"

          request "/dashboard/agent"
          case "$HTTP_STATUS" in
            302|303|307|308) ;;
            *)
              echo "::error::/dashboard/agent répond $HTTP_STATUS, attendu une redirection anonyme."
              head -c 300 "$HTTP_BODY" || true
              exit 1
              ;;
          esac
          echo "/dashboard/agent : $HTTP_STATUS"
          echo "Candidate production validée sans bascule publique: $PRODUCTION_DEPLOYMENT_URL"

      - name: Réconcilier HubSpot avant promotion
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DEPLOYMENT_URL"
          test -n "$PRODUCTION_RECONCILE_TOKEN"
          response="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $PRODUCTION_RECONCILE_TOKEN" \
            -H "x-vercel-protection-bypass: $PRODUCTION_PROTECTION_BYPASS" \
            "$PRODUCTION_DEPLOYMENT_URL/api/internal/hubspot/reconcile" \
            -o "$response"
          node - "$response" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload?.ok !== true) {
            console.error("::error::La réconciliation HubSpot de la candidate a échoué.");
            process.exit(1);
          }
          const orders = payload?.summary?.orders;
          if (!orders || Number(orders.failed ?? 0) !== 0) {
            console.error(
              "::error::La réconciliation des commandes HubSpot contient des erreurs: " +
                JSON.stringify(orders ?? null).slice(0, 400),
            );
            process.exit(1);
          }
          console.log(
            "HubSpot commandes: " +
              JSON.stringify({
                vus: orders.seen,
                succès: orders.succeeded,
                erreurs: orders.failed,
              }),
          );
          NODE

      - name: Promouvoir la candidate validée vers les domaines production
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DEPLOYMENT_URL"
          test -n "$PRODUCTION_DEPLOYMENT_ID"
          promotion_response="$(mktemp)"
          promotion_status="$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -o "$promotion_response" \
            -w "%{http_code}" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$PRODUCTION_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          case "$promotion_status" in
            201|202) ;;
            *)
              echo "::error::La promotion Vercel a répondu $promotion_status."
              head -c 500 "$promotion_response" || true
              exit 1
              ;;
          esac

          promoted=false
          for attempt in $(seq 1 30); do
            health_body="$(mktemp)"
            if curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "$PRODUCTION_URL/api/release-health?promotion_check=$GITHUB_RUN_ID-$attempt" \
              -o "$health_body" && \
              node - "$health_body" <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (
            health?.appEnv !== "production" ||
            health?.releaseSha !== process.env.RELEASE_SHA ||
            health?.supabaseProjectRef !== process.env.PRODUCTION_SUPABASE_PROJECT_REF
          ) process.exit(1);
          NODE
            then
              promoted=true
              break
            fi
            echo "Promotion Vercel en cours — tentative $attempt/30."
            sleep 2
          done
          test "$promoted" = true || {
            echo "::error::Le domaine public n'a pas basculé sur la candidate production vérifiée."
            exit 1
          }
          echo "Promotion Vercel confirmée sur $PRODUCTION_URL."

      - name: Smoke du domaine public après promotion
        run: |
          set -eu
          smoke_passed=false
          for attempt in $(seq 1 12); do
            if BASE_URL="$PRODUCTION_URL" \
              EXPECTED_APP_ENV=production \
              EXPECTED_SUPABASE_PROJECT_REF="$PRODUCTION_SUPABASE_PROJECT_REF" \
              EXPECTED_RELEASE_SHA="$RELEASE_SHA" \
              npm run staging:smoke; then
              smoke_passed=true
              break
            fi
            echo "Propagation du domaine public en cours — smoke $attempt/12."
            sleep 5
          done
          test "$smoke_passed" = true || {
            echo "::error::Le domaine public n'a pas convergé vers le SHA $RELEASE_SHA dans la fenêtre de smoke."
            exit 1
          }

      - name: Preuve release
        run: |
          {
            echo "### Production déployée"
            echo "- SHA: \`$RELEASE_SHA\`"
            echo "- CI: PASS"
            echo "- Release staging officielle + smoke public: PASS"
            echo "- Supabase staging/production: projets distincts et vérifiés"
            echo "- migrations Git/staging/production: identiques"
            echo "- candidate production testée avant promotion: \`$PRODUCTION_DEPLOYMENT_URL\`"
            echo "- promotion Vercel: PASS"
            echo "- domaine public production smoke: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
