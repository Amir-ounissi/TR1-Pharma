name: Release production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA Git exact à valider en staging puis déployer en production"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tr1-production-release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  VERCEL_CLI_VERSION: 59.19.1
  CURRENT_PRODUCTION_SUPABASE_PROJECT_REF: zhifmehctuflwfexlvkz
  CURRENT_STAGING_SUPABASE_PROJECT_REF: ehptapmuzckazyxmnmnm
  CURRENT_PRODUCTION_VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
  CURRENT_STAGING_VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh

jobs:
  gate:
    name: Gate du SHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Vérifier le SHA et son appartenance à main
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || {
            echo "::error::Le checkout ne correspond pas au SHA demandé."
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "::error::Le SHA demandé n'appartient pas à l'historique de main."
            exit 1
          }

      - name: Exiger une CI verte sur ce SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          result=""
          for attempt in $(seq 1 30); do
            result="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&per_page=20" \
              --jq '(.workflow_runs | sort_by(.run_started_at) | reverse | .[0]) as $run | if $run == null then "missing" elif $run.status == "completed" then ($run.conclusion // "unknown") else $run.status end')"
            case "$result" in
              success)
                echo "CI verte trouvée pour $RELEASE_SHA."
                break
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::La CI du SHA $RELEASE_SHA est terminée avec l'état $result."
                exit 1
                ;;
              *)
                echo "CI $RELEASE_SHA: $result — nouvelle vérification dans 20 s."
                sleep 20
                ;;
            esac
          done
          test "$result" = "success" || {
            echo "::error::La CI du SHA $RELEASE_SHA n'est pas devenue verte dans la fenêtre du gate."
            exit 1
          }

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release:check:local

  staging:
    name: Staging officiel — preuve et smoke
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_STAGING_PUBLIC_URL: https://tr-1-pharma-dusky.vercel.app
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Exiger une Release staging verte sur ce SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          count="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-staging.yml/runs?head_sha=${RELEASE_SHA}&event=workflow_dispatch&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
          test "$count" -gt 0 || {
            echo "::error::Aucune Release staging verte n'est attachée au SHA $RELEASE_SHA."
            exit 1
          }

      - name: Smoke staging public
        run: BASE_URL="$VERCEL_STAGING_PUBLIC_URL" npm run staging:smoke

      - name: Preuve staging
        run: |
          {
            echo "### Staging officiel validé"
            echo "- SHA: `$RELEASE_SHA`"
            echo "- workflow Release staging: PASS"
            echo "- URL publique: `$VERCEL_STAGING_PUBLIC_URL`"
            echo "- smoke: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production — migration gate et déploiement du même SHA
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ehptapmuzckazyxmnmnm
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: zhifmehctuflwfexlvkz
      PRODUCTION_SUPABASE_URL: https://zhifmehctuflwfexlvkz.supabase.co
      PRODUCTION_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dFtfD60cflPn_IqSZriScQ_g0TRS66x
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_WhI0GBrg7UZgZpDsvTwUGZ8V
      VERCEL_PROJECT_ID: prj_KziP4kPjCBHDULmFuvGSLFOzDtVh
      PRODUCTION_URL: https://www.tr1pharma.com
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Vérifier la configuration production
        run: |
          set -eu
          for name in STAGING_DATABASE_URL STAGING_SUPABASE_PROJECT_REF PRODUCTION_DATABASE_URL PRODUCTION_SUPABASE_PROJECT_REF PRODUCTION_SUPABASE_URL PRODUCTION_SUPABASE_PUBLISHABLE_KEY VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_URL; do
            eval "value=\${$name:-}"
            test -n "$value" || {
              echo "::error::$name n'est pas configuré pour l'environnement production."
              exit 1
            }
          done
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$PRODUCTION_SUPABASE_PROJECT_REF" = "$CURRENT_PRODUCTION_SUPABASE_PROJECT_REF" || {
            echo "::error::PRODUCTION_SUPABASE_PROJECT_REF ne correspond pas au projet de production actuellement vérifié."
            exit 1
          }
          test "$STAGING_SUPABASE_PROJECT_REF" = "$CURRENT_STAGING_SUPABASE_PROJECT_REF" || {
            echo "::error::STAGING_SUPABASE_PROJECT_REF ne correspond pas au staging canonique."
            exit 1
          }
          test "$VERCEL_PROJECT_ID" = "$CURRENT_PRODUCTION_VERCEL_PROJECT_ID" || {
            echo "::error::Le projet Vercel de production n'est pas le projet actuellement public."
            exit 1
          }
          case "$PRODUCTION_SUPABASE_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*) ;;
            *)
              echo "::error::PRODUCTION_SUPABASE_URL ne correspond pas au projet Supabase production."
              exit 1
              ;;
          esac
          test "$STAGING_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" || {
            echo "::error::Staging et production ne peuvent pas partager le même projet Supabase."
            exit 1
          }
          case "$PRODUCTION_DATABASE_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*) ;;
            *)
              echo "::error::PRODUCTION_DATABASE_URL ne correspond pas à PRODUCTION_SUPABASE_PROJECT_REF."
              exit 1
              ;;
          esac
          case "$STAGING_DATABASE_URL" in
            *"$STAGING_SUPABASE_PROJECT_REF"*) ;;
            *)
              echo "::error::STAGING_DATABASE_URL ne correspond pas à STAGING_SUPABASE_PROJECT_REF."
              exit 1
              ;;
          esac

      - name: Vérifier le préflight migrations
        run: npm run release:drift:preflight

      - name: Appliquer les migrations production
        run: npm exec -- supabase db push --db-url "$PRODUCTION_DATABASE_URL"

      - name: Exiger Git = staging = production
        run: npm run release:drift

      - name: Déployer exactement le SHA sur le projet Vercel production
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env "APP_ENV=production" \
            --build-env "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL" \
            --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            --build-env "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL" \
            --env "APP_ENV=production" \
            --env "NEXT_PUBLIC_SUPABASE_URL=$PRODUCTION_SUPABASE_URL" \
            --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            --env "NEXT_PUBLIC_APP_URL=$PRODUCTION_URL"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Smoke production
        run: BASE_URL="$PRODUCTION_URL" npm run staging:smoke

      - name: Preuve release
        run: |
          {
            echo "### Production déployée"
            echo "- SHA: \`$RELEASE_SHA\`"
            echo "- CI: PASS"
            echo "- Release staging officielle + smoke public: PASS"
            echo "- Supabase staging/production: projets distincts et vérifiés"
            echo "- migrations Git/staging/production: identiques"
            echo "- production smoke: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
