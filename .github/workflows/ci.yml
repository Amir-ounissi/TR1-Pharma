name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Qualité applicative
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Historique des migrations immuable
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          changes="$(git diff --name-status "$BASE_SHA" HEAD -- supabase/migrations || true)"
          printf '%s\n' "$changes"
          forbidden="$(printf '%s\n' "$changes" | awk 'NF && $1 != "A" { print }')"
          if [ -n "$forbidden" ]; then
            echo "::error::Une migration déjà présente sur la branche de base a été modifiée, renommée ou supprimée. Ajoutez une nouvelle migration corrective au lieu de réécrire l'historique."
            printf '%s\n' "$forbidden"
            exit 1
          fi
      - name: Interdire les commits interrupteurs Vercel
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if ! git diff --quiet "$BASE_SHA" HEAD -- vercel.json; then
            echo "::error::vercel.json est un contrat d'infrastructure, pas un interrupteur de release. Déployez/promouvez l'artefact validé sans modifier deploymentEnabled dans une PR produit."
            git diff "$BASE_SHA" HEAD -- vercel.json
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release:check:local
      - name: Audit complet
        run: npm audit --audit-level=high
      - name: Audit runtime
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Base locale et pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run test:db
      - run: npm run db:lint
      - run: npm run db:advisors
      - name: Stop Supabase
        if: always()
        run: sh scripts/supabase-local.sh stop --no-backup

  e2e:
    name: E2E production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/tr1-playwright-browsers
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Neutraliser le dépôt Chrome du runner
        run: |
          grep -rl "dl.google.com/linux/chrome-stable/deb" /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
      - run: npx playwright install --with-deps chromium
      - run: npm run db:start
      - run: npm run db:reset
      - name: Run Playwright E2E
        timeout-minutes: 20
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: sh scripts/supabase-local.sh stop --no-backup
