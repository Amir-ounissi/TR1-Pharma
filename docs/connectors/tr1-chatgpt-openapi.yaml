openapi: 3.1.0
info:
  title: TR1 PHARMA Connector
  version: 0.1.0
  description: Read-only, brand-scoped TR1 pharmacy lookup. Requires a real TR1 user OAuth access token.
servers:
  - url: https://www.tr1pharma.com
paths:
  /api/connectors/chatgpt/pharmacies:
    get:
      operationId: searchTr1Pharmacies
      summary: Search pharmacies authorized for the signed-in TR1 user
      description: Never search outside the user's brand. Returns up to ten matching pharmacies.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - name: brand_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized matching pharmacies
          content:
            application/json:
              schema:
                type: object
                properties:
                  pharmacies:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401":
          description: Missing or invalid access token
        "403":
          description: Brand not authorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
